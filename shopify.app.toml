# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "955895a982d9e495af60ecf5e4f0d9c1"
application_url = "https://app.spraay.app"
embedded = true
name = "Spraay Batch Payouts"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Spraay sends batch USDC payouts on Base. It does not read or write Shopify
# store resources, so it requests no access scopes. Add "read_orders" here later
# if payouts are ever tied to order data (note: that is Protected Customer Data
# and requires additional Shopify approval).
scopes = ""

[auth]
redirect_urls = [
  "https://app.spraay.app/auth/callback",
  "https://app.spraay.app/auth/shopify/callback",
  "https://app.spraay.app/api/auth/callback",
]

[build]
automatically_update_urls_on_dev = true
